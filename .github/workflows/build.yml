
name: Build TaCZ 1.21.1 NeoForge

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -q "$ZIP" -d extracted
            PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f | head -n 1)")
          elif [ -f gradlew ]; then
            PROJECT_DIR="."
          else
            echo "ERROR: Project ZIP or gradlew not found!"
            exit 1
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TaCZ-1.21.1-NEOFORGE
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
